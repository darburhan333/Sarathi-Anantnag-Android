plugins { id 'com.android.application' }
def releaseStorePath = System.getenv('RELEASE_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }
android {
 namespace 'com.sarathi.geckotest'
 compileSdk { version = release(37) { minorApiLevel = 0 } }
 defaultConfig {
  applicationId 'com.sarathi.anantnag.gecko.v33'
  minSdk 26
  targetSdk 34
  versionCode 340
  versionName '3.4-v11.47-recovery1'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  ndk { abiFilters(project.findProperty('testAbi') ?: 'arm64-v8a') }
 }
 packaging { jniLibs { useLegacyPackaging = true } }
 signingConfigs {
  if (hasReleaseSigning) {
   release {
    storeFile file(releaseStorePath)
    storePassword releaseStorePassword
    keyAlias releaseKeyAlias
    keyPassword releaseKeyPassword
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled true
   shrinkResources true
   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
   if (hasReleaseSigning) {
    signingConfig signingConfigs.release
   } else if (project.hasProperty('smokeRelease')) {
    signingConfig signingConfigs.debug
   }
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'org.mozilla.geckoview:geckoview:158.0.20261021001945'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:rules:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
tasks.register('prepareProfiles', Exec) { commandLine 'python3', rootProject.file('scripts/prepare-profiles.py') }
tasks.named('preBuild').configure { dependsOn 'prepareProfiles' }
