plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sarathi.monitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.sarathi.monitor"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.0.2-alert-only"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
