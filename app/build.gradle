plugins { id 'com.android.application' }
android {
 namespace 'com.sarathi.geckotest'
 compileSdk 37
 defaultConfig {
  applicationId 'com.sarathi.anantnag.gecko'
  minSdk 26
  targetSdk 34
  versionCode 330
  versionName '3.3-v11.47'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  ndk { abiFilters(project.findProperty('testAbi') ?: 'arm64-v8a') }
 }
 packaging { jniLibs { useLegacyPackaging = true } }
 buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'; if(project.hasProperty('smokeRelease')) signingConfig signingConfigs.debug } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'org.mozilla.geckoview:geckoview:158.0.20261021001945'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:rules:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}


tasks.register('prepareProfiles', Exec) { commandLine 'python3', rootProject.file('scripts/prepare-profiles.py') }
tasks.named('preBuild').configure { dependsOn 'prepareProfiles' }


