name: Focused safe-stop and release startup
on:
  push:
    branches: [build/mparivahan-v3.3-safe-stop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          ram-size: 4096
          disable-animations: true
          script: |
            gradle -PtestAbi=x86_64 '-Pandroid.testInstrumentationRunnerArguments.class=com.sarathi.geckotest.GeckoIntegrationTest#backgroundStallStopsAllWithoutClosingPages' connectedDebugAndroidTest --stacktrace
            gradle -PtestAbi=x86_64 -PsmokeRelease assembleRelease --stacktrace
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell pm clear com.sarathi.anantnag.gecko
            python3 scripts/release-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Safe-stop-and-release-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            release-preview.png
            release-ui.xml
