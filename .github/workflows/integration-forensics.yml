name: Inspect integration evidence
on:
  push:
    branches: ['build/**']
    paths: ['diagnostics/inspect-request.json']
concurrency:
  group: sarathi-evidence-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      source_sha: ${{ steps.request.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: request
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          value=json.load(open('diagnostics/inspect-request.json'))
          mode=value.get('mode','inspect')
          if mode not in ('inspect','password_preflight','engine_probe'):raise SystemExit('Unsupported evidence mode')
          source=value.get('source_sha','')
          if mode in ('password_preflight','engine_probe') and not re.fullmatch('[a-f0-9]{40}',source):raise SystemExit('Invalid source SHA')
          print('run_id='+str(int(value['run_id'])))
          print('mode='+mode)
          print('source_sha='+source)
          PY
      - uses: actions/download-artifact@v4
        if: steps.request.outputs.mode == 'inspect'
        with:
          name: Gecko-integration-results
          run-id: ${{ steps.request.outputs.run_id }}
          github-token: ${{ github.token }}
          path: previous-integration
      - name: Print first failure and main-thread evidence
        if: steps.request.outputs.mode == 'inspect'
        run: python3 diagnostics/inspect.py
  password-preflight:
    needs: inspect
    if: needs.inspect.outputs.mode == 'password_preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.source_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build exact-source instrumentation APKs before emulator boot
        run: |
          gradle -PtestAbi=x86_64 assembleDebug assembleDebugAndroidTest
          gradle --stop
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          ram-size: 4096
          disable-animations: true
          script: |
            adb install -r "$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
            adb shell pm grant com.sarathi.anantnag.gecko.v33 android.permission.POST_NOTIFICATIONS
            gradle -PtestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.sarathi.geckotest.TelegramSettingsLockTest connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: Telegram-lock-focused-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn

  resolve-engine-probes:
    needs: inspect
    if: needs.inspect.outputs.mode == 'engine_probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.resolve.outputs.plan }}
    steps:
      - id: resolve
        name: Resolve official stable GeckoView candidates
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re,urllib.request,xml.etree.ElementTree as ET
          plan=[{'label':'baseline','version':'158.0.20261021001945'},{'label':'single-surface','version':'158.0.20261021001945'}]
          print('plan='+json.dumps({'include':plan},separators=(',',':')))
          PY
  engine-probe:
    needs: [inspect, resolve-engine-probes]
    if: needs.inspect.outputs.mode == 'engine_probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-engine-probes.outputs.plan) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.source_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Select engine for isolated reproducer
        env:
          PROBE_GECKO_VERSION: ${{ matrix.version }}
          PROBE_VARIANT: ${{ matrix.label }}
        run: |
          python3 - <<'PY'
          import os,re,pathlib
          version=os.environ['PROBE_GECKO_VERSION']
          if not re.fullmatch(r'\d+\.\d+\.\d{14}',version):raise SystemExit('Invalid engine version')
          path=pathlib.Path('app/build.gradle')
          value,count=re.subn(r"org\.mozilla\.geckoview:geckoview:[^']+",'org.mozilla.geckoview:geckoview:'+version,path.read_text())
          if count!=1:raise SystemExit('Expected exactly one Gecko dependency')
          path.write_text(value)
          pathlib.Path('engine-version.txt').write_text(version+'\n')
          if os.environ['PROBE_VARIANT']=='single-surface':
           path=pathlib.Path('app/src/main/java/com/sarathi/geckotest/MainActivity.java')
           old="      if(engine.current!=null&&engine.current.isOpen()&&view.getSession()!=engine.current){BrowserEngine.releaseView(view);view.setSession(engine.current);engine.activeStates.remove(engine.current);}\n      if(engine.monitorSession!=null&&engine.monitorSession.isOpen()&&monitorView.getSession()!=engine.monitorSession){BrowserEngine.releaseView(monitorView);monitorView.setSession(engine.monitorSession);engine.activeStates.remove(engine.monitorSession);}\n      monitorView.setVisibility(engine.showingMonitor?View.VISIBLE:View.GONE);"
           new="      // Attach only the displayed surface. Detached sessions remain owned by\n      // BrowserEngine and retain the existing monitoring/protection activity policy.\n      GeckoView shown=engine.showingMonitor?monitorView:view;\n      GeckoView hidden=engine.showingMonitor?view:monitorView;\n      org.mozilla.geckoview.GeckoSession displayed=engine.showingMonitor?engine.monitorSession:engine.current;\n      boolean ownershipChanged=false;\n      if(hidden.getSession()!=null){\n        org.mozilla.geckoview.GeckoSession detached=hidden.getSession();\n        BrowserEngine.releaseView(hidden);engine.activeStates.remove(detached);ownershipChanged=true;\n      }\n      if(displayed!=null&&displayed.isOpen()&&shown.getSession()!=displayed){\n        BrowserEngine.releaseView(shown);shown.setSession(displayed);engine.activeStates.remove(displayed);ownershipChanged=true;\n      }\n      view.setVisibility(engine.showingMonitor?View.GONE:View.VISIBLE);\n      monitorView.setVisibility(engine.showingMonitor?View.VISIBLE:View.GONE);\n      if(ownershipChanged)engine.activate();"
           text=path.read_text()
           if text.count(old)!=1:raise SystemExit('Expected single render ownership block')
           path.write_text(text.replace(old,new))
          pathlib.Path('probe-scenario.txt').write_text('Original 29 lifecycle scenarios; variant '+os.environ['PROBE_VARIANT']+chr(10))
          print('Testing GeckoView '+version)
          PY
      - name: Build SMS teardown reproducer
        run: |
          gradle -PtestAbi=x86_64 assembleDebug assembleDebugAndroidTest
          gradle --stop
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          ram-size: 4096
          disable-animations: true
          script: |
            adb install -r "$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
            adb shell pm grant com.sarathi.anantnag.gecko.v33 android.permission.POST_NOTIFICATIONS
            adb shell dumpsys deviceidle whitelist +com.sarathi.anantnag.gecko.v33
            gradle -PtestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.sarathi.geckotest.GeckoIntegrationTest#backgroundStallRecoversWithoutClosingPages,com.sarathi.geckotest.GeckoIntegrationTest#backgroundRecoveryRetriesAndIsolatesFailure,com.sarathi.geckotest.GeckoIntegrationTest#encryptedSettingsRoundTrip,com.sarathi.geckotest.GeckoIntegrationTest#applicantPhonesAreSeparateAndEncrypted,com.sarathi.geckotest.GeckoIntegrationTest#stopCancelsEveryConcurrentWaitOnce,com.sarathi.geckotest.GeckoIntegrationTest#backgroundCriticalNativeFailureIsCaughtBeforeRemoteDelivery,com.sarathi.geckotest.GeckoIntegrationTest#normalMonitoringStartThenStopDoesNotRequireProtectionConfirmation,com.sarathi.geckotest.GeckoIntegrationTest#stopDuringCalendarReviewDisarmsAndKeepsProtectedPageActive,com.sarathi.geckotest.GeckoIntegrationTest#stopDuringSmsStageKeepsProtectedPageActiveAndForeground,com.sarathi.geckotest.GeckoIntegrationTest#stopProtectionRetentionIsFiveMinutesForSmsAndCalendar,com.sarathi.geckotest.GeckoIntegrationTest#pageReplacementDetachesAccessibilityBeforeClosingOldSession,com.sarathi.geckotest.GeckoIntegrationTest#simultaneousSessionExpiryEvidenceIsPerApplicantAndRedacted,com.sarathi.geckotest.GeckoIntegrationTest#applicantSettingsLockAndVisibilityDoNotStopOtherApplicants,com.sarathi.geckotest.GeckoIntegrationTest#fullScreenSettingsPreserveWebsiteSession,com.sarathi.geckotest.GeckoIntegrationTest#signatureControlsKeepGlobalAndSelectedActionsSeparate,com.sarathi.geckotest.GeckoIntegrationTest#compactLayoutKeepsActionsAboveMonitorAndLogsSeparate,com.sarathi.geckotest.GeckoIntegrationTest#quickCallRequiresBothDirectPreferenceAndPhonePermission,com.sarathi.geckotest.GeckoIntegrationTest#delayedNativeSilenceCannotCancelANewerCriticalAlert,com.sarathi.geckotest.GeckoIntegrationTest#backAndHomeConfirmOnlyWhenPageProtected,com.sarathi.geckotest.GeckoIntegrationTest#lostNormalPageRecoversButLostProtectedPageDoesNotReplace,com.sarathi.geckotest.GeckoIntegrationTest#idleUnloadRetainsLoggedInPagesUnlessRealMemoryPressure,com.sarathi.geckotest.GeckoIntegrationTest#idleUnloadTimeoutDefaultsToSixtyMinutesAndCanBeConfigured,com.sarathi.geckotest.GeckoIntegrationTest#sessionExpiredStateDisarmsRun,com.sarathi.geckotest.GeckoIntegrationTest#sessionExpiredIsTerminalAndAppearsInNotificationAndCopyLog,com.sarathi.geckotest.GeckoIntegrationTest#pageReadyReasonsUseOnlyActionableSarathiStates,com.sarathi.geckotest.GeckoIntegrationTest#idlePageLossRecoversWithoutAlarmAndHomeWorksWithoutBridge,com.sarathi.geckotest.GeckoIntegrationTest#recoveryRequiresMatchingRunAndCannotResumeAfterStop,com.sarathi.geckotest.GeckoIntegrationTest#telegramCredentialsAreIsolated,com.sarathi.geckotest.GeckoIntegrationTest#silenceAllPreservesRuns connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: Gecko-engine-probe-${{ matrix.label }}
          path: |
            engine-version.txt
            probe-scenario.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
