name: Inspect integration evidence
on:
  push:
    branches: ['build/**']
    paths: ['diagnostics/inspect-request.json']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      source_sha: ${{ steps.request.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: request
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          value=json.load(open('diagnostics/inspect-request.json'))
          mode=value.get('mode','inspect')
          if mode not in ('inspect','password_preflight'):raise SystemExit('Unsupported evidence mode')
          source=value.get('source_sha','')
          if mode=='password_preflight' and not re.fullmatch('[a-f0-9]{40}',source):raise SystemExit('Invalid source SHA')
          print('run_id='+str(int(value['run_id'])))
          print('mode='+mode)
          print('source_sha='+source)
          PY
      - uses: actions/download-artifact@v4
        if: steps.request.outputs.mode == 'inspect'
        with:
          name: Gecko-integration-results
          run-id: ${{ steps.request.outputs.run_id }}
          github-token: ${{ github.token }}
          path: previous-integration
      - name: Print first failure and main-thread evidence
        if: steps.request.outputs.mode == 'inspect'
        run: python3 diagnostics/inspect.py
  password-preflight:
    needs: inspect
    if: needs.inspect.outputs.mode == 'password_preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.source_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build exact-source instrumentation APKs before emulator boot
        run: |
          gradle -PtestAbi=x86_64 assembleDebug assembleDebugAndroidTest
          gradle --stop
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          ram-size: 4096
          disable-animations: true
          script: gradle -PtestAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.sarathi.geckotest.TelegramSettingsLockTest connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: Telegram-lock-focused-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
