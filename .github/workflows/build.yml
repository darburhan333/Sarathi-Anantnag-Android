name: Build and test MParivahan 3.6 safety
on:
  push:
    branches:
      - 'build/**'
  workflow_dispatch:
concurrency:
  group: sarathi-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile debug app and Android tests
        run: ./gradlew :app:compileDebugJavaWithJavac :app:compileDebugAndroidTestJavaWithJavac
  apk:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Require production signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production signing secret $name is missing for ref $GITHUB_REF"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
          test -s "$RUNNER_TEMP/release-key.jks"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Production signing key loaded for $GITHUB_REF"
      - name: Baseline regression tests and Android adapter tests
        run: python3 scripts/verify.py
      - name: Browser DOM integration (offline fixtures only)
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/browser-flow.py
      - name: Build release APK and lint
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease lintRelease --stacktrace
      - name: Verify production APK certificate matches 3.5
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::Release APK not found"; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-certificate.txt
          ACTUAL="$(sed -n 's/.*certificate SHA-256 digest: //p' apk-certificate.txt | head -1 | tr '[:upper:]' '[:lower:]')"
          EXPECTED="c7404cb6be4325298d64a82d00f27ffa4fefaf182b0a569b4ed2d91fc072b145"
          if [ -z "$ACTUAL" ]; then
            echo "::error::APK is unsigned or apksigner did not report a certificate SHA-256 fingerprint."
            exit 1
          fi
          echo "APK certificate SHA-256: $ACTUAL"
          echo "3.5 baseline certificate SHA-256: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signing certificate differs from the 3.5 baseline; do not install this APK as an update."
            exit 1
          fi
          echo "Certificate identity matches the 3.5 baseline."
      - name: Export APK signing utilities
        run: |
          mkdir -p signing-tools
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -1)
          cp "$tools" signing-tools/
          cp "$(dirname "$(dirname "$tools")")/zipalign" signing-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: Android-signing-utilities
          path: signing-tools/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MParivahan-JK-3.6-safety-ARM64-UNVERIFIED
          path: |
            app/build/outputs/apk/release/*.apk
            apk-certificate.txt
          if-no-files-found: error
  gecko-integration:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          ram-size: 4096
          disable-animations: true
          script: bash scripts/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Gecko-integration-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator-logcat.txt
            emulator-power.txt
            emulator-deviceidle.txt
            ci-evidence/
            monitor-copy-log.txt
            monitor-preview.png
            release-preview.png
            release-ui.xml
            service-state.txt
            emulator-diagnostic-capture-status.txt
            release-smoke-failure.txt
          if-no-files-found: warn

  verified-release:
    needs: [apk, gecko-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MParivahan-JK-3.6-safety-ARM64-UNVERIFIED
          path: verified
      - uses: actions/upload-artifact@v4
        with:
          name: MParivahan-JK-3.6-safety-ARM64-TESTS-PASSED
          path: verified/
          if-no-files-found: error
