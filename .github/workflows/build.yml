name: Build and test Sarathi Gecko V11.47 port
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Baseline regression tests and Android adapter tests
        run: python3 scripts/verify.py
      - name: Browser DOM integration (offline fixtures only)
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/browser-flow.py
      - name: Build compressed arm64 APK and lint
        run: gradle assembleRelease lintRelease --stacktrace
      - name: Export APK signing utilities
        run: |
          mkdir -p signing-tools
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -1)
          cp "$tools" signing-tools/
          cp "$(dirname "$(dirname "$tools")")/zipalign" signing-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: Android-signing-utilities
          path: signing-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: MParivahan-JK-3.2-arm64-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
  gecko-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          ram-size: 4096
          disable-animations: true
          script: bash scripts/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Gecko-integration-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator-logcat.txt
            monitor-preview.png
            release-preview.png
            release-ui.xml
            service-state.txt




