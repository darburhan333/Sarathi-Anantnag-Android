name: Build and test Sarathi Gecko V11.47 port (3.6 safety)
on:
  push:
    branches:
      - build/mparivahan-v3.4-recovery
  workflow_dispatch:
concurrency:
  group: sarathi-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Prepare signing key (if repository secrets are configured)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Signing key secrets found."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; this run will only create an unsigned APK."
          fi
      - name: Baseline regression tests and Android adapter tests
        run: python3 scripts/verify.py
      - name: Browser DOM integration (offline fixtures only)
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/browser-flow.py
      - name: Build release APK and lint
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease lintRelease --stacktrace
      - name: Verify signed APK
        if: steps.signing.outputs.available == 'true'
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Export APK signing utilities
        run: |
          mkdir -p signing-tools
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -1)
          cp "$tools" signing-tools/
          cp "$(dirname "$(dirname "$tools")")/zipalign" signing-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: Android-signing-utilities
          path: signing-tools/
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: MParivahan-JK-3.6-arm64-signed-keepalive
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available != 'true'
        with:
          name: MParivahan-JK-3.6-arm64-unsigned-safety
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
  gecko-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          ram-size: 4096
          disable-animations: true
          script: bash scripts/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Gecko-integration-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator-logcat.txt
            monitor-preview.png
            release-preview.png
            release-ui.xml
            service-state.txt
