name: Release UI verification
on:
  push:
    branches: [build/mparivahan-v3.4-recovery]
    paths: [app/src/main/assets/extension/manifest.json, app/src/debug/assets/extension/manifest.json, app/build.gradle, scripts/emulator-test.sh, scripts/release-smoke.py, .github/workflows/release-ui-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile release before booting emulator
        run: gradle --no-daemon -PtestAbi=x86_64 -PsmokeRelease assembleRelease --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          ram-size: 4096
          disable-animations: true
          script: bash scripts/emulator-test.sh release-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Release-UI-results
          path: |
            release-preview.png
            release-ui.xml
            emulator-logcat.txt
            release-smoke-failure.txt
